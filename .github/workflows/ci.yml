name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write

jobs:
  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  shell-syntax:
    name: Shell syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install ZSH
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check ZSH syntax
        run: zsh -n zshrc

      - name: Check Makefile
        run: make help >/dev/null

  startup-time:
    name: ZSH startup performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install ZSH
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install dotfiles
        run: |
          ln -sf "$PWD/zshrc" "$HOME/.zshrc"
          ln -sf "$PWD/zsh.d" "$HOME/.zsh.d"

      - name: Pre-warm ZSH (install plugins, build compinit cache)
        run: |
          zsh -i -c exit 2>&1 | tail -5 || true
        shell: bash

      - name: Measure ZSH startup
        run: |
          TIMEFORMAT="%R"
          elapsed=$( { time zsh -i -c exit 2>/dev/null; } 2>&1 ) || true
          elapsed_ms=$(echo "$elapsed" | LC_ALL=C awk 'END { printf "%.0f", $1 * 1000 }')
          echo "ZSH startup: ${elapsed_ms}ms"
          if (( elapsed_ms > 110 )); then
            echo "FAIL: ${elapsed_ms}ms exceeds 110ms target"
            exit 1
          else
            echo "OK: ${elapsed_ms}ms (target <110ms)"
          fi
        shell: bash

  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-check:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check for hardcoded secrets
        run: |
          if grep -rn \
            -e 'password\s*=' \
            -e 'api_key\s*=' \
            -e 'secret\s*=' \
            --include="*.zsh" \
            --include="*.sh" \
            --include="*.conf" \
            --include="*.env" \
            --exclude-dir=.git \
            --exclude-dir=.pre-commit \
            . 2>/dev/null | grep -v '^\s*#'; then
            echo "FAIL: potential hardcoded secrets detected"
            exit 1
          fi
          echo "OK: no hardcoded secrets found"

  container-scan:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan pinned Docker images
        run: |
          # Images from zsh.d/alias.zsh (update this list when adding new images)
          images=(
            "kalilinux/kali-rolling@sha256:7997e0581c4f5c185cfe6773d5cae8fcc7c6b79798726ccaabf843af4bcd2013"
            "parrotsec/core@sha256:2dcefa48d3c4ae6b1a1a1391ae2a0ae6115a3c194b3677b3f0487f0e3996c9cd"
            "debian@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1"
            "archlinux@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413"
            "wpscanteam/wpscan@sha256:ae7685d5d6cbd86956ba4cb45b9e14ab808c45096b10a751252a9a1044c3764d"
            "secfigo/nikto@sha256:fdb9c08ee732d6ef85c4321c276af0acacc6bcf478980540387ef80ba1818799"
            "projectdiscovery/nuclei@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb"
            "metasploitframework/metasploit-framework@sha256:b1c4950615fec43bdbe915de7de4b144a24803b21765b86cf0df52799ab08776"
            "zaproxy/zap-stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238"
          )
          for img in "${images[@]}"; do
            echo "Scanning $img..."
            trivy image --severity HIGH,CRITICAL --format table "$img" || true
          done
        env:
          TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2"
          TRIVY_JAVA_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-java-db:1"

  alignment-check:
    name: Alignment check (main in develop)
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Ensure main is ancestor of PR head
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "FAIL: origin/main is not an ancestor of this PR"; exit 1
          fi
          echo "OK: main is contained in this branch"

  pr-source-check:
    name: PR source check (only develop -> main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "FAIL: only develop may merge into main (got ${{ github.head_ref }})"; exit 1
          fi
          echo "OK: source branch is develop"
