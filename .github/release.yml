changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - feat
        - feature
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Performance
      labels:
        - perf
        - performance
    - title: Chores
      labels:
        - chore
        - refactor
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
